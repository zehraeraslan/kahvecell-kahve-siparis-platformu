services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/kahvecell.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-kahvecell-local-docker-key-change-before-deploying}
    ports:
      - "8001:8000"
    volumes:
      - kahvecell_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  kahvecell_data:
